<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GitHub User Search</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      body {
        background: linear-gradient(135deg, #f3f4f6 0%, #e0f2fe 100%);
      }
    </style>
  </head>
  <body class="min-h-screen flex items-center justify-center p-6">
    <main class="w-full max-w-2xl">
      <div class="rounded-3xl bg-white/90 shadow-xl backdrop-blur-sm p-6 md:p-8">
        <h1 class="text-3xl font-bold text-slate-800 text-center mb-6">GitHub User Search</h1>

        <form id="search-form" class="flex flex-col sm:flex-row gap-3 mb-8">
          <input
            id="username"
            type="text"
            placeholder="GitHubユーザー名を入力"
            class="flex-1 rounded-xl border border-slate-200 bg-slate-50 px-4 py-3 text-slate-800 outline-none transition focus:border-sky-400 focus:ring-2 focus:ring-sky-200"
          />
          <button
            id="search-button"
            type="submit"
            class="rounded-xl bg-sky-600 px-5 py-3 font-semibold text-white transition hover:bg-sky-500 disabled:cursor-not-allowed disabled:bg-sky-300"
          >
            検索
          </button>
        </form>

        <div id="status" class="mb-6 hidden rounded-xl border border-sky-200 bg-sky-50 px-4 py-3 text-sm text-sky-700"></div>

        <section id="user-card" class="hidden overflow-hidden rounded-2xl border border-slate-200 bg-slate-50 shadow-sm">
          <div class="flex flex-col items-center gap-5 p-6 md:flex-row md:items-start">
            <img id="avatar" alt="GitHub avatar" class="h-28 w-28 rounded-full border-4 border-white shadow-md object-cover md:h-32 md:w-32" />

            <div class="flex-1 text-center md:text-left">
              <h2 id="name" class="text-2xl font-bold text-slate-800"></h2>
              <p id="bio" class="mt-2 text-slate-600"></p>

              <div class="mt-5 grid gap-3 sm:grid-cols-3">
                <div class="rounded-xl bg-white p-3 shadow-sm">
                  <p class="text-xs uppercase tracking-wide text-slate-500">Followers</p>
                  <p id="followers" class="mt-1 text-xl font-bold text-slate-800"></p>
                </div>
                <div class="rounded-xl bg-white p-3 shadow-sm">
                  <p class="text-xs uppercase tracking-wide text-slate-500">Repos</p>
                  <p id="repos" class="mt-1 text-xl font-bold text-slate-800"></p>
                </div>
                <div class="rounded-xl bg-white p-3 shadow-sm">
                  <p class="text-xs uppercase tracking-wide text-slate-500">Profile</p>
                  <a id="profile-link" href="#" target="_blank" rel="noreferrer" class="mt-1 inline-block text-sm font-medium text-sky-600 hover:text-sky-500">Open</a>
                </div>
              </div>
            </div>
          </div>
        </section>
      </div>
    </main>

    <script>
      const form = document.getElementById('search-form');
      const usernameInput = document.getElementById('username');
      const button = document.getElementById('search-button');
      const status = document.getElementById('status');
      const userCard = document.getElementById('user-card');
      const avatar = document.getElementById('avatar');
      const name = document.getElementById('name');
      const bio = document.getElementById('bio');
      const followers = document.getElementById('followers');
      const repos = document.getElementById('repos');
      const profileLink = document.getElementById('profile-link');

      function setStatus(message, type = 'info') {
        status.textContent = message;
        status.className = 'mb-6 rounded-xl border px-4 py-3 text-sm';

        if (type === 'error') {
          status.classList.add('border-red-200', 'bg-red-50', 'text-red-700');
        } else if (type === 'loading') {
          status.classList.add('border-sky-200', 'bg-sky-50', 'text-sky-700');
        } else {
          status.classList.add('border-slate-200', 'bg-slate-50', 'text-slate-700');
        }

        status.classList.remove('hidden');
      }

      function resetUserCard() {
        userCard.classList.add('hidden');
      }

      function renderUser(user) {
        avatar.src = user.avatar_url;
        avatar.alt = `${user.login} avatar`;
        name.textContent = user.name || user.login;
        bio.textContent = user.bio || '自己紹介はまだありません。';
        followers.textContent = user.followers;
        repos.textContent = user.public_repos;
        profileLink.href = user.html_url;
        profileLink.textContent = 'GitHub';
        userCard.classList.remove('hidden');
      }

      form.addEventListener('submit', async (event) => {
        event.preventDefault();

        const username = usernameInput.value.trim();
        if (!username) {
          setStatus('ユーザー名を入力してください。', 'error');
          resetUserCard();
          return;
        }

        button.disabled = true;
        setStatus('読み込み中...', 'loading');
        resetUserCard();

        try {
          const response = await fetch(`https://api.github.com/users/${username}`);

          if (!response.ok) {
            throw new Error('ユーザーが見つかりませんでした');
          }

          const user = await response.json();

          console.log('取得したGitHubユーザーデータ:', user);
          console.log('使うプロパティ例:', {
            avatar_url: user.avatar_url,
            name: user.name,
            bio: user.bio,
            followers: user.followers,
            public_repos: user.public_repos,
            html_url: user.html_url,
          });

          renderUser(user);
          setStatus('ユーザー情報を取得しました。');
        } catch (error) {
          console.error(error);
          setStatus(error.message || 'エラーが発生しました。', 'error');
        } finally {
          button.disabled = false;
        }
      });
    </script>
  </body>
</html>
